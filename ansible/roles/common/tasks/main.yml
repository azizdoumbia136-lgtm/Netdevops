---
- name: Mettre a jour le cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - net-tools
      - dnsutils
      - chrony
      - prometheus-node-exporter
    state: present

- name: Demarrer et activer node-exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
